<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Ticket | Support CRM</title>
    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar bg-white border-bottom mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">Support CRM</a>
            <a class="btn btn-primary btn-sm" href="new.html">+ New Ticket</a>
        </div>
    </nav>

    <main class="container" style="max-width: 640px;">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h4 mb-3">Create a ticket</h1>

                <div id="alert"></div>

                <form id="ticket-form">
                    <div class="mb-3">
                        <label class="form-label" for="customer_name">Customer name</label>
                        <input class="form-control" id="customer_name" name="customer_name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="customer_email">Customer email</label>
                        <input class="form-control" type="email" id="customer_email" name="customer_email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="subject">Issue title</label>
                        <input class="form-control" id="subject" name="subject" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="description">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="4" required></textarea>
                    </div>
                    <button type="submit" id="submit-btn" class="btn btn-primary">Create ticket</button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/new.js"></script>
</body>

</html>
