<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticket | Support CRM</title>
    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar bg-white border-bottom mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">Support CRM</a>
            <a class="btn btn-primary btn-sm" href="new.html">+ New Ticket</a>
        </div>
    </nav>

    <main class="container" style="max-width: 760px;">
        <a href="index.html" class="text-decoration-none">&larr; Back to all tickets</a>

        <div id="alert" class="mt-3"></div>

        <div id="ticket-view" class="d-none">
            <div class="card shadow-sm mt-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                        <div>
                            <div id="t-id" class="text-muted small"></div>
                            <h1 id="t-subject" class="h4 mb-0"></h1>
                        </div>
                        <span id="t-badge" class="badge"></span>
                    </div>
                    <hr>
                    <dl class="row mb-0">
                        <dt class="col-sm-3">Customer</dt>
                        <dd id="t-name" class="col-sm-9"></dd>
                        <dt class="col-sm-3">Email</dt>
                        <dd id="t-email" class="col-sm-9"></dd>
                        <dt class="col-sm-3">Created</dt>
                        <dd id="t-created" class="col-sm-9"></dd>
                        <dt class="col-sm-3">Last updated</dt>
                        <dd id="t-updated" class="col-sm-9"></dd>
                        <dt class="col-sm-3">Description</dt>
                        <dd id="t-description" class="col-sm-9 mb-0" style="white-space: pre-wrap;"></dd>
                    </dl>
                </div>
            </div>

            <div class="card shadow-sm mt-3">
                <div class="card-body">
                    <h2 class="h6">Update status</h2>
                    <div class="d-flex gap-2">
                        <select id="status-select" class="form-select">
                            <option value="Open">Open</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Closed">Closed</option>
                        </select>
                        <button id="status-btn" class="btn btn-primary text-nowrap">Save status</button>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm mt-3 mb-5">
                <div class="card-body">
                    <h2 class="h6">Notes</h2>
                    <form id="note-form" class="mb-3">
                        <textarea id="note-text" class="form-control mb-2" rows="3"
                            placeholder="Add a note or comment..." required></textarea>
                        <button id="note-btn" type="submit" class="btn btn-outline-primary btn-sm">Add note</button>
                    </form>
                    <div id="notes-list"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/ticket.js"></script>
</body>

</html>
