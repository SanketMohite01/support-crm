<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tickets | Support CRM</title>
    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar bg-white border-bottom mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">Support CRM</a>
            <a class="btn btn-primary btn-sm" href="new.html">+ New Ticket</a>
        </div>
    </nav>

    <main class="container">
        <div class="row g-2 mb-3">
            <div class="col-12 col-md-8">
                <input id="search" class="form-control" type="search"
                    placeholder="Search by name, email, ticket ID, title or description...">
            </div>
            <div class="col-12 col-md-4">
                <select id="status-filter" class="form-select">
                    <option value="">All statuses</option>
                    <option value="Open">Open</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Closed">Closed</option>
                </select>
            </div>
        </div>

        <p id="count" class="text-muted small mb-2"></p>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Title</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="ticket-list"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/sla.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
